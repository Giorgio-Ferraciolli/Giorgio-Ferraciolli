services:
  # 1. Banco de Dados PostgreSQL
  zabbix-db:
    image: postgres:16
    container_name: zabbix-db
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=mudar123
      - POSTGRES_DB=zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    restart: unless-stopped

  # 2. Zabbix Server (Baseado em Ubuntu 24)
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=mudar123
      - POSTGRES_DB=zabbix
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    depends_on:
      - zabbix-db
    restart: unless-stopped

  # 3. Zabbix Web Interface + Nginx (Baseado em Ubuntu 24)
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=mudar123
      - POSTGRES_DB=zabbix
      - PHP_TZ=America/Sao_Paulo # Fuso horário da interface
    ports:
      - "80:8080"   # Acessível na porta 80 do seu host
      - "443:8443"  # Acessível na porta 443 do seu host (HTTPS)
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
      - zabbix-db
    restart: unless-stopped

networks:
  zabbix-net:
    driver: bridge

volumes:
  zabbix-db-data:
